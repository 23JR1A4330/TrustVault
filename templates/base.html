<!doctype html><html><head><meta charset="utf-8"><title>TrustVault</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#20252b}
nav{background:#17212b;color:white;padding:14px 24px;display:flex;justify-content:space-between}
nav a{color:white;text-decoration:none;margin-left:18px}.wrap{max-width:1050px;margin:28px auto;padding:0 18px}
.card{background:white;padding:20px;border-radius:10px;margin-bottom:18px;box-shadow:0 2px 8px #0001}
input,select{padding:9px;border:1px solid #ccd3da;border-radius:6px;margin:5px}
button,.btn{background:#1769aa;color:white;border:0;border-radius:6px;padding:9px 13px;text-decoration:none;cursor:pointer}
.danger{background:#b42318}.muted{color:#667}.error{color:#b42318}.success{color:#087443}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
</style></head><body>
<nav><b>TrustVault</b><span>{% if session.user_id %}<a href="/dashboard">Documents</a>{% if user and user.role=="admin" %}<a href="/admin/audit">Audit</a>{% endif %}<a href="/logout">Logout</a>{% endif %}</span></nav>
<div class="wrap">
{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="card">{{m}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</div></body></html>
